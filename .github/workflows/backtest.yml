name: Freqtrade Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Freqtrade backtest
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}/user_data:/freqtrade/user_data" \
            -v "${{ github.workspace }}/run_backtest.sh:/freqtrade/run_backtest.sh:ro" \
            freqtradeorg/freqtrade:stable \
            /freqtrade/run_backtest.sh

      - name: Save backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-backtest-results
          path: user_data/backtest_results/
          if-no-files-found: warn
