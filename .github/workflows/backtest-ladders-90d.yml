name: Strategy001 90d Ladder Comparison

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Compare four ladders over 90 days
        run: python backtest_ladders_90d.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy001-90d-ladder-results
          path: ladder_results/
          if-no-files-found: warn
