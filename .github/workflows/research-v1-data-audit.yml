name: Research V1 Data Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Binance Vision 1h archives (paper only)
        run: python -u research_v1_data_audit.py

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v1-data-audit-results
          path: research_v1_results/
          if-no-files-found: warn
