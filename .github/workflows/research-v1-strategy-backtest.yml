name: Research V1 Strategy Backtest

on:
  workflow_dispatch:

jobs:
  research-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Run research-only strategy backtest
        run: python research_v1_strategy_backtest.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v1-strategy-backtest-results
          path: research_v1_backtest_results/
          if-no-files-found: warn
