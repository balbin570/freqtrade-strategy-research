
name: A2 BTC Trend Filter Top5 Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run A2 BTC trend comparison
        run: python backtest_a2_btc_regime_top5.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-btc-regime-top5-results
          path: backtest_results_a2_btc_regime_top5/
          if-no-files-found: error
