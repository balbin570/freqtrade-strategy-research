
name: Backtest SuperTrend Markov 180D

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'

      - name: Run independent paper-only backtest
        run: python backtest_supertrend_markov_180d.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-markov-180d-results
          path: supertrend_markov_results/
          if-no-files-found: warn
