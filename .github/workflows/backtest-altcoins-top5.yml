
name: Altcoins Top5 Strategy001 vs A2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run Top5 comparison
        run: python backtest_altcoins_top5_compare.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoins-top5-comparison-results
          path: backtest_results_top5/
          if-no-files-found: warn
