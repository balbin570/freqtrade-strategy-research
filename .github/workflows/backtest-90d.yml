
name: Strategy001 90-Day Stop-Loss Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run backtest
        run: python backtest_90d.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy001-90d-results
          path: backtest_results/
          if-no-files-found: warn
