name: SuperTrend 180D Data and Signal Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'PyYAML>=6,<7'
      - name: Obtain upstream Hermes source (read-only)
        run: git clone --depth 1 https://github.com/chrysek70/hermes-trading.git hermes_source
      - name: Run offline-data and causal-signal audit
        run: python audit_supertrend_180d.py
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-180d-audit
          path: supertrend_audit_results/
          if-no-files-found: warn
