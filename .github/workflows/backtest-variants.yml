name: Strategy001 Five Variants Backtest

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Compare five variants
        run: python backtest_variants.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy001-five-variants-results
          path: variant_results/
          if-no-files-found: warn
