name: Render Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render service
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            "https://freqtrade-live-paper-v1.onrender.com/health"
